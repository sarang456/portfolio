<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day4</title>
</head>
<body>
    <form>
        <table border="3" align="center" height="700" width="400">
            <tr>
                <b><th colspan="2">Registration Form</th></b>
            </tr>
            <tr>
                <td align="center"><label for="name">User Name:</label></td>
                <td><input type="text" id="name" name="name" placeholder="Enter Your Name"/></td>
            </tr>
            <tr>
                <td align="center"><label for="dob">Date of Birth:</label></td>
                <td><input type="date" id="date" name="date"/></td>
            </tr>
            <tr>
                <td align="center"><label for="Gender">Select one of them:</label></td>
                <td>
                    <input type="radio" id="male" name="Gender" value="male"/>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="Gender" value="female"/>
                    <label for="female">Female</label>
                    <input type="radio" id="oth" name="Gender" value="oth"/>
                    <label for="oth">Other</label>
                </td>
            </tr>
            <tr>
                <td align="center"><label for="email">Email_Id:</label></td>
                <td><input type="email" id="email" name="email" placeholder="Enter Your Email_Id..."/></td>
            </tr>
            <tr>
                <td align="center"><label for="Number">Mobile No:</label></td>
                <td><input type="tel" id="Number" name="Number" placeholder="Enter Your Mobile Number..."/></td>
            </tr>
            <tr>
                <th colspan="2">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </th>
            </tr>
        </table>
    </form>
    <p>ID:-DV05WD00020</p>
</body>
</html>
